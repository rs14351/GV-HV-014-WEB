<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GV-HV-014 | Área de Trabalho</title>
</head>
<body style="margin:0;min-height:100vh;background:linear-gradient(145deg,#10243b,#182f49);color:#ffffff;font-family:Segoe UI,Arial,sans-serif;">
  <header style="padding:14px 18px;background:rgba(9,22,38,0.88);border-bottom:1px solid rgba(255,255,255,0.12);">
    <div style="color:#d1b978;font-size:15px;font-weight:700;letter-spacing:1px;">GRUPO VALENÇA</div>
    <div style="margin-top:3px;color:#aebdd0;font-size:12px;">Estação GV-HV-014</div>
  </header>

  <main style="display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:18px;padding:28px 20px 100px;max-width:520px;margin:0 auto;">
    <button type="button" onclick="window.location.href='correio.html'" style="min-height:125px;padding:18px 10px;border:1px solid rgba(255,255,255,0.16);border-radius:12px;background:rgba(255,255,255,0.08);color:#ffffff;font-size:16px;cursor:pointer;">
      <span style="display:block;margin-bottom:10px;font-size:42px;">✉</span>
      Correio
    </button>

    <button type="button" onclick="window.location.href='projetos.html'" style="min-height:125px;padding:18px 10px;border:1px solid rgba(255,255,255,0.16);border-radius:12px;background:rgba(255,255,255,0.08);color:#ffffff;font-size:16px;cursor:pointer;">
      <span style="display:block;margin-bottom:10px;font-size:42px;">📁</span>
      Projetos
    </button>

    <button type="button" onclick="window.location.href='agenda.html'" style="min-height:125px;padding:18px 10px;border:1px solid rgba(255,255,255,0.16);border-radius:12px;background:rgba(255,255,255,0.08);color:#ffffff;font-size:16px;cursor:pointer;">
      <span style="display:block;margin-bottom:10px;font-size:42px;">📅</span>
      Agenda
    </button>

    <button type="button" onclick="window.location.href='edge.html'" style="min-height:125px;padding:18px 10px;border:1px solid rgba(255,255,255,0.16);border-radius:12px;background:rgba(255,255,255,0.08);color:#ffffff;font-size:16px;cursor:pointer;">
      <span style="display:block;margin-bottom:10px;font-size:42px;">🌐</span>
      Microsoft Edge
    </button>

    <button type="button" onclick="window.location.href='lixeira.html'" style="min-height:125px;padding:18px 10px;border:1px solid rgba(255,255,255,0.16);border-radius:12px;background:rgba(255,255,255,0.08);color:#ffffff;font-size:16px;cursor:pointer;">
      <span style="display:block;margin-bottom:10px;font-size:42px;">🗑</span>
      Lixeira
    </button>
  </main>

  <footer style="position:fixed;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(7,17,30,0.96);border-top:1px solid rgba(255,255,255,0.12);color:#aebdd0;font-size:12px;">
    <span>GV-HV-014</span>
    <span>Rede corporativa conectada</span>
  </footer>
</body>
</html>
